name: Build Android APK RedTeam

on:
  push:
    branches:
      - build/apk-redteam-20260806
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-apk-redteam-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CI: "true"
      EXPO_NO_TELEMETRY: "1"
      EXPO_PUBLIC_API_URL: "https://lioracamward.com"
      NODE_OPTIONS: "--max_old_space_size=4096"
    steps:
      - name: Checkout isolated build branch
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          cache: pnpm

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.33.4 --activate

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Expo prebuild Android
        working-directory: apps/mobile
        run: pnpm exec expo prebuild --platform android --clean --no-install

      - name: Build debug APK
        working-directory: apps/mobile/android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Collect APK
        run: |
          mkdir -p dist
          cp apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk dist/LIORA-CAMWARD-1.0.0-redteam-debug.apk
          sha256sum dist/LIORA-CAMWARD-1.0.0-redteam-debug.apk | tee dist/SHA256SUMS.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LIORA-CAMWARD-APK
          path: dist/*
          if-no-files-found: error
          retention-days: 30
