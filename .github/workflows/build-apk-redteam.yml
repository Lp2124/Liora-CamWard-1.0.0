name: Build Android APK RedTeam

on:
  push:
    branches:
      - build/apk-redteam-20260806
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Runner smoke test
        run: |
          uname -a
          node --version
          java -version
          echo "runner-ok"
